    <style>
        /* --- 基礎設定 --- */
        :root {
            --primary-color: #41a573;
            --secondary-color: #ffffff;
            --text-color: #393939;
            --bg-color: #f4f7f6;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }

        /* --- Hero區塊 --- */
        .hero {
            position: relative;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            padding: 80px 20px;
            text-align: center;
            border-bottom: 5px solid var(--primary-color);
        }

        .hero-content { max-width: 800px; margin: 0 auto; }

        .sub-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.95);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 5px;
            letter-spacing: 1px;
        }

        /* 標題樣式 (粗框設計) */
        .main-title {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            margin-bottom: 20px;
            letter-spacing: 3px;
            line-height: 1.2;
            -webkit-text-stroke: 3px #41a573;
            paint-order: stroke fill;
        }

        .hero-desc {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 500;
            max-width: 700px;
            margin: 0 auto 30px auto;
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .search-container { max-width: 600px; margin: 0 auto; position: relative; }
        .search-input {
            width: 100%;
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* --- 容器與分區設定 (新) --- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px 80px 20px;
        }

        /* 區段標題樣式 */
        .section-header {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-color);
            margin: 50px 0 25px 0;
            padding-left: 15px;
            border-left: 6px solid var(--primary-color);
            display: flex;
            align-items: center;
        }
        
        /* 第一個標題距離上方近一點 */
        #title-main { margin-top: 10px; }

        /* 網格系統 (改為 class 控制) */
        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        /* --- 餐廳卡片 --- */
        .card {
            background: var(--secondary-color);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }

        .card-header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .card-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            flex-shrink: 0;
            background-color: #eee;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-color);
            line-height: 1.3;
        }

        /* 圖片輪播 */
        .carousel {
            position: relative;
            width: 100%;
            height: 250px;
            background: #eee;
            overflow: hidden;
        }
        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        
        .carousel-img {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            scroll-snap-align: center;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: 0.2s;
        }
        .carousel-btn:hover { background: var(--primary-color); }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }

        /* 卡片內容 */
        .card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 4.5em;
        }
        .divider {
            border-top: 2px dotted var(--primary-color);
            margin: 10px 0 15px 0;
            width: 100%;
        }
        .info-row { margin-bottom: 8px; font-size: 1rem; }
        .info-label { color: var(--primary-color); font-weight: bold; margin-right: 5px; }
        .price-text { font-weight: bold; font-size: 1.1rem; color: #333; }
        
        .note-text {
            font-size: 0.85rem;
            color: #e67e22;
            background: #fff3e0;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
        }

        .card-footer { padding: 20px; padding-top: 0; }
        .menu-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .menu-btn:hover { background-color: #358c60; }

        /* 置頂按鈕 */
        #scrollTopBtn {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--primary-color); color: white;
            width: 50px; height: 50px; border-radius: 50%;
            border: none; cursor: pointer; display: none;
            font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 99;
            transition: bottom 0.3s ease;
        }

        /* ★★★ 手機版專用修正 ★★★ */
         @media (max-width: 768px) {
            #scrollTopBtn {
                /* 手機版將置頂按鈕往上提，避開底部的投票按鈕 */
                bottom: 120px; 
                right: 20px; /* 手機版靠右邊界稍微縮小一點 */
            }
        }

        /* 投票按鈕 (底部置中懸浮) */
        .vote-fab-centered {
            position: fixed;
            bottom: 30px;
            left: 0; right: 0; margin: 0 auto;
            z-index: 10000;
            width: 90%; max-width: 500px;
            background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
            color: white;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(221, 36, 118, 0.6);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            padding: 15px 0;
            text-decoration: none; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px;
            animation: pulse-glow 2s infinite;
            transition: all 0.3s ease;
        }
        .vote-fab-centered:hover {
            background: linear-gradient(135deg, #ff6b4b 0%, #ff3d85 100%);
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 10px 25px rgba(221, 36, 118, 0.8);
            animation: none;
        }
        .vote-icon { font-size: 1.5rem; }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(221, 36, 118, 0.7); transform: scale(1); }
            50% { transform: scale(1.03); }
            70% { box-shadow: 0 0 0 20px rgba(221, 36, 118, 0); transform: scale(1.03); }
            100% { box-shadow: 0 0 0 0 rgba(221, 36, 118, 0); transform: scale(1); }
        }


        /* --- 手機版與平板的微調 --- */
        @media (max-width: 768px) {
            .hero-content { padding-top: 20px; }
            .main-title { font-size: 2.2rem; -webkit-text-stroke: 2px #41a573; }
        }
        @media (min-width: 768px) {
            .vote-fab-centered { bottom: 40px; width: 400px; }
        }


/* --- 品牌推薦橫幅 (EATING-OUT) --- */
.promo-banner {
    max-width: 1200px;

    position: relative;

}

.promo-banner a {
    display: block;
    width: 100%;
    border-radius: 15px;
    overflow: hidden;
    
}

.banner-img {
    width: 100%;

    display: block;

}

/* 手機版微調 */
@media (max-width: 768px) {
    .promo-banner {
        padding: 0 10px; /* 手機版左右留白少一點，讓圖片可以大一點 */
    }
    
    .banner-img {
        /* 移除 min-height 設定 */
        min-height: auto; 
    }
}

        // --- 生成卡片 HTML 的輔助函式 ---
        function createCard(rest) {
            const slides = `
                <img src="photo/${rest.id}-01.jpg" class="carousel-img" onerror="this.style.display='none'" loading="lazy">
                <img src="photo/${rest.id}-02.jpg" class="carousel-img" onerror="this.style.display='none'" loading="lazy">
                <img src="photo/${rest.id}-03.jpg" class="carousel-img" onerror="this.style.display='none'" loading="lazy">
            `;

            const logoPath = `logo/${rest.id}.jpg`;
            const noteHtml = rest.note ? `<div class="note-text">★ ${rest.note}</div>` : '';

            return `
                <div class="card">
                    <div class="card-header">
                        <img src="${logoPath}" class="card-logo" onerror="this.src='https://via.placeholder.com/60?text=${rest.id}'">
                        <div class="card-title">${rest.name}</div>
                    </div>
                    <div class="carousel" id="carousel-${rest.id}">
                        <div class="carousel-track">${slides}</div>
                        <button class="carousel-btn prev" onclick="scrollCarousel('${rest.id}', -1)">&#10094;</button>
                        <button class="carousel-btn next" onclick="scrollCarousel('${rest.id}', 1)">&#10095;</button>
                    </div>
                    <div class="card-body">
                        <div class="card-desc" title="${rest.desc}">${rest.desc}</div>
                        ${noteHtml}
                        <div class="divider"></div>
                        <div class="info-row"><span class="info-label">主打品項 |</span>${rest.items}</div>
                        <div class="info-row"><span class="info-label">價格區間 |</span><span class="price-text">${rest.price}</span></div>
                    </div>
                    <div class="card-footer">
                        <a href="${rest.menu}" class="menu-btn" target="_blank">查看菜單</a>
                    </div>
                </div>
            `;
        }

        // --- 核心：分區渲染 ---
        function renderGrid(data) {
            // 1. 分類
            const mainData = data.filter(r => r.id <= 28);
            const breakfastData = data.filter(r => r.id >= 29 && r.id <= 33);
            const drinkData = data.filter(r => r.id >= 34);

            // 2. 輔助渲染函式 (負責處理標題顯示/隱藏)
            const renderSection = (items, containerId, titleId) => {
                const container = document.getElementById(containerId);
                const title = document.getElementById(titleId);
                container.innerHTML = ''; // 清空

                if (items.length === 0) {
                    // 若該區無資料（例如搜尋過濾後），隱藏標題與網格
                    container.style.display = 'none';
                    title.style.display = 'none';
                } else {
                    // 有資料則顯示
                    container.style.display = 'grid';
                    title.style.display = 'flex'; // 標題恢復顯示
                    container.innerHTML = items.map(rest => createCard(rest)).join('');
                }
            };

            // 3. 執行渲染
            renderSection(mainData, 'grid-main', 'title-main');
            renderSection(breakfastData, 'grid-breakfast', 'title-breakfast');
            renderSection(drinkData, 'grid-drink', 'title-drink');
        }

        // --- 輪播功能 ---
        function scrollCarousel(id, direction) {
            const container = document.querySelector(`#carousel-${id} .carousel-track`);
            if(!container) return;
            const scrollAmount = container.clientWidth;
            const maxScroll = container.scrollWidth - container.clientWidth;
            
            if (direction === 1) { 
                if (container.scrollLeft >= maxScroll - 5) {
                    container.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            } else { 
                if (container.scrollLeft <= 5) {
                    container.scrollTo({ left: container.scrollWidth, behavior: 'smooth' });
                } else {
                    container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                }
            }
        }

        // --- 搜尋功能 ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = restaurants.filter(r => 
                r.name.toLowerCase().includes(term) || 
                r.items.toLowerCase().includes(term) ||
                r.desc.toLowerCase().includes(term) || 
                (r.note && r.note.toLowerCase().includes(term))
            );
            renderGrid(filtered);
        });

        // --- 置頂按鈕顯示 ---
        window.onscroll = function() {
            const btn = document.getElementById('scrollTopBtn');
            if (window.scrollY > 300) btn.style.display = "block";
            else btn.style.display = "none";
        };

        // --- 初始化 ---
        renderGrid(restaurants);

    </script>
